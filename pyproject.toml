[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nineteen"
version = "6.0.0"
readme = "README.md"
requires-python = ">=3.10"
description = "Auditor package for Nineteen, refer to Dockerfiles for Miner and Validator setup"
license = { text = "MIT" }
authors = [{ name = "namoray", email = "namoray@rayonlabs.ai" }]
dependencies = [
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0,<1.1.0",
    "websocket-client==1.8.0",
    "aiohttp==3.11.11",
    "httpx==0.27.0",
    "substrate-interface==1.7.10",
    "fiber @ git+https://github.com/rayonlabs/fiber.git@2.3.0",
    "pydantic==2.9.2",
    "pydantic_core==2.23.4"
]

[tool.pyright]
exclude = ["**/node_modules", "**/__pycache__", "**/test_*.py", "**/venv/*"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.10"
pythonPlatform = "Linux"
reportMissingModuleSource = false

[tool.typos.default]
extend-ignore-identifiers-re = [
    "datas",
]

[tool.typos.default.extend-words]
ninteen = "nineteen"